<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<meta
  name="theme-color"
  content="#071a2d">

<title>
Tropic District | Administrador
</title>

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    #eef2f5;

  color:#17202a;

  min-height:100vh;

}


/* =========================================================
   VARIABLES
========================================================= */

:root{

  --azul:#0878d1;

  --azul-oscuro:#071a2d;

  --amarillo:#ffd21c;

  --rojo:#ef3340;

  --verde:#12a86b;

  --rosa:#ff4fa3;

  --gris:#68727d;

  --blanco:#fff;

  --borde:#dfe5e9;

}


/* =========================================================
   LOGIN
========================================================= */

.login{

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    linear-gradient(
      135deg,
      #071a2d,
      #0878d1,
      #12a86b
    );

}

.login-box{

  width:100%;

  max-width:430px;

  background:white;

  border-radius:22px;

  padding:35px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.3);

  text-align:center;

}

.login-logo{

  width:65px;

  height:65px;

  margin:0 auto 18px;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      var(--azul),
      var(--verde)
    );

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:23px;

  font-weight:900;

  box-shadow:
    5px 5px 0 var(--amarillo);

}

.login-box h1{

  font-size:27px;

  margin-bottom:5px;

}

.login-box p{

  color:var(--gris);

  font-size:13px;

  margin-bottom:25px;

}

.login-box input{

  width:100%;

  padding:14px;

  border:
    1px solid #ccd4da;

  border-radius:10px;

  margin-bottom:12px;

  font-size:15px;

  outline:none;

}

.login-box input:focus{

  border-color:
    var(--azul);

}

.btn-login{

  width:100%;

  padding:14px;

  border:0;

  border-radius:10px;

  background:
    var(--azul);

  color:white;

  font-weight:900;

  font-size:15px;

  cursor:pointer;

}

.btn-login:hover{

  background:
    var(--azul-oscuro);

}

.login-error{

  display:none;

  margin-top:15px;

  background:#ffe7e9;

  color:#b4232d;

  padding:11px;

  border-radius:9px;

  font-size:13px;

}


/* =========================================================
   ADMIN
========================================================= */

.admin{

  display:none;

  min-height:100vh;

}


/* =========================================================
   HEADER
========================================================= */

.topbar{

  background:
    var(--azul-oscuro);

  color:white;

  padding:15px 20px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;

  position:sticky;

  top:0;

  z-index:1000;

  border-bottom:
    4px solid var(--amarillo);

}

.topbar-marca{

  display:flex;

  align-items:center;

  gap:12px;

}

.logo-admin{

  width:45px;

  height:45px;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      var(--azul),
      var(--verde)
    );

  display:flex;

  align-items:center;

  justify-content:center;

  font-weight:900;

  box-shadow:
    4px 4px 0 var(--amarillo);

}

.topbar h1{

  font-size:21px;

}

.topbar small{

  color:#bcd0df;

}

.btn-logout{

  border:
    1px solid #ffffff55;

  background:
    transparent;

  color:white;

  padding:9px 14px;

  border-radius:9px;

  cursor:pointer;

}


/* =========================================================
   CONTENEDOR
========================================================= */

.contenedor{

  max-width:1200px;

  margin:auto;

  padding:25px 20px 60px;

}


/* =========================================================
   ESTADISTICAS
========================================================= */

.stats{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:15px;

  margin-bottom:25px;

}

.stat{

  background:white;

  padding:20px;

  border-radius:15px;

  border:
    1px solid var(--borde);

  box-shadow:
    0 5px 18px rgba(0,0,0,.06);

}

.stat span{

  display:block;

  color:var(--gris);

  font-size:12px;

  margin-bottom:7px;

}

.stat strong{

  font-size:27px;

}


/* =========================================================
   ACCIONES
========================================================= */

.acciones{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:20px;

}

.btn-principal{

  border:0;

  background:
    var(--azul);

  color:white;

  padding:13px 18px;

  border-radius:10px;

  font-weight:900;

  cursor:pointer;

}

.btn-principal:hover{

  background:
    var(--azul-oscuro);

}


/* =========================================================
   BUSQUEDA
========================================================= */

.busqueda{

  width:100%;

  padding:13px 15px;

  border:
    1px solid var(--borde);

  border-radius:10px;

  margin-bottom:20px;

  font-size:14px;

  outline:none;

}

.busqueda:focus{

  border-color:
    var(--azul);

}


/* =========================================================
   LISTA
========================================================= */

.lista{

  display:flex;

  flex-direction:column;

  gap:10px;

}

.item{

  background:white;

  border:
    1px solid var(--borde);

  border-radius:14px;

  padding:13px;

  display:flex;

  align-items:center;

  gap:15px;

}

.item-imagen{

  width:80px;

  height:80px;

  object-fit:cover;

  border-radius:10px;

  background:#eef2f5;

  flex-shrink:0;

}

.item-info{

  flex:1;

  min-width:0;

}

.item-info h3{

  font-size:16px;

  margin-bottom:4px;

}

.item-info p{

  color:var(--gris);

  font-size:12px;

  margin:3px 0;

}

.item-precio{

  font-weight:900;

  font-size:17px;

}

.item-categoria{

  display:inline-block;

  background:
    #eaf4fc;

  color:
    var(--azul);

  padding:4px 8px;

  border-radius:15px;

  font-size:10px;

  font-weight:900;

  text-transform:uppercase;

}

.item-acciones{

  display:flex;

  flex-wrap:wrap;

  gap:7px;

}

.btn-editar,
.btn-estado,
.btn-eliminar{

  border:0;

  padding:8px 10px;

  border-radius:8px;

  cursor:pointer;

  font-weight:800;

  font-size:11px;

}

.btn-editar{

  background:
    #e9f3fb;

  color:
    var(--azul);

}

.btn-estado{

  background:
    #e9f8f1;

  color:
    var(--verde);

}

.btn-estado.inactivo{

  background:
    #fff0f0;

  color:
    var(--rojo);

}

.btn-eliminar{

  background:
    #ffe8ea;

  color:
    var(--rojo);

}


/* =========================================================
   MODAL
========================================================= */

.modal{

  display:none;

  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.75);

  z-index:3000;

  padding:20px;

  overflow:auto;

}

.modal-box{

  max-width:650px;

  margin:3% auto;

  background:white;

  border-radius:20px;

  padding:28px;

  position:relative;

}

.modal-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:20px;

}

.modal-header h2{

  font-size:24px;

}

.cerrar{

  width:38px;

  height:38px;

  border:0;

  border-radius:50%;

  background:#eef2f5;

  font-size:25px;

  cursor:pointer;

}


/* =========================================================
   FORMULARIO
========================================================= */

.form-grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:15px;

}

.campo{

  display:flex;

  flex-direction:column;

}

.campo.full{

  grid-column:
    1 / -1;

}

.campo label{

  font-size:12px;

  font-weight:900;

  margin-bottom:6px;

}

.campo input,
.campo select,
.campo textarea{

  width:100%;

  padding:12px;

  border:
    1px solid #ccd4da;

  border-radius:9px;

  font-family:Arial;

  outline:none;

}

.campo textarea{

  min-height:90px;

  resize:vertical;

}

.campo input:focus,
.campo select:focus,
.campo textarea:focus{

  border-color:
    var(--azul);

}


/* =========================================================
   ACCESORIOS
========================================================= */

.accesorios-extra{

  display:none;

  margin-top:15px;

  padding:15px;

  background:
    #fff2fa;

  border:
    1px solid #ffc4e3;

  border-radius:12px;

}

.accesorios-extra h3{

  color:
    var(--rosa);

  font-size:14px;

  margin-bottom:12px;

}


/* =========================================================
   FOTO
========================================================= */

.foto-area{

  margin-top:18px;

  border:
    2px dashed #ccd4da;

  border-radius:12px;

  padding:15px;

  text-align:center;

}

.foto-preview{

  width:180px;

  height:180px;

  object-fit:cover;

  border-radius:12px;

  display:none;

  margin:0 auto 12px;

}

.input-foto{

  width:100%;

}


/* =========================================================
   GUARDAR
========================================================= */

.btn-guardar{

  width:100%;

  margin-top:20px;

  padding:15px;

  border:0;

  border-radius:10px;

  background:
    var(--verde);

  color:white;

  font-weight:900;

  font-size:15px;

  cursor:pointer;

}

.btn-guardar:hover{

  background:
    #0b8d59;

}


/* =========================================================
   MENSAJE
========================================================= */

.toast{

  position:fixed;

  right:20px;

  bottom:20px;

  z-index:5000;

  background:
    var(--azul-oscuro);

  color:white;

  padding:14px 18px;

  border-radius:10px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.25);

  display:none;

  font-size:13px;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

  .topbar{

    padding:
      12px 15px;

  }

  .topbar h1{

    font-size:17px;

  }

  .stats{

    grid-template-columns:
      1fr;

  }

  .acciones{

    align-items:
      stretch;

  }

  .item{

    align-items:
      flex-start;

  }

  .item-imagen{

    width:65px;

    height:65px;

  }

  .item-acciones{

    flex-direction:
      column;

  }

  .form-grid{

    grid-template-columns:
      1fr;

  }

  .campo.full{

    grid-column:
      auto;

  }

  .modal-box{

    margin:
      0 auto;

    padding:20px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section
  class="login"
  id="login">

  <div class="login-box">

    <div class="login-logo">
      TD
    </div>

    <h1>
      TROPIC DISTRICT
    </h1>

    <p>
      Panel de administración
    </p>


    <form
      onsubmit="iniciarSesion(event)">

      <input
        type="email"
        id="email"
        required
        placeholder="Correo electrónico">


      <input
        type="password"
        id="password"
        required
        placeholder="Contraseña">


      <button
        class="btn-login"
        type="submit">

        ENTRAR AL ADMINISTRADOR

      </button>

    </form>


    <div
      class="login-error"
      id="loginError">

    </div>

  </div>

</section>


<!-- =====================================================
     ADMIN
===================================================== -->

<section
  class="admin"
  id="admin">


  <!-- HEADER -->

  <header class="topbar">

    <div class="topbar-marca">

      <div class="logo-admin">
        TD
      </div>

      <div>

        <h1>
          TROPIC DISTRICT
        </h1>

        <small>
          Administración de tienda
        </small>

      </div>

    </div>


    <button
      class="btn-logout"
      onclick="cerrarSesion()">

      Cerrar sesión

    </button>

  </header>


  <!-- CONTENIDO -->

  <main class="contenedor">


    <!-- ESTADISTICAS -->

    <div class="stats">

      <div class="stat">

        <span>
          Productos
        </span>

        <strong id="totalProductos">
          0
        </strong>

      </div>


      <div class="stat">

        <span>
          Activos
        </span>

        <strong id="productosActivos">
          0
        </strong>

      </div>


      <div class="stat">

        <span>
          Categorías
        </span>

        <strong id="totalCategorias">
          0
        </strong>

      </div>

    </div>


    <!-- ACCIONES -->

    <div class="acciones">

      <button
        class="btn-principal"
        onclick="abrirNuevoProducto()">

        + AGREGAR PRODUCTO

      </button>

    </div>


    <!-- BUSCAR -->

    <input
      class="busqueda"
      id="busqueda"
      type="search"
      placeholder="Buscar producto, marca o categoría..."
      oninput="filtrarProductos()">


    <!-- LISTA -->

    <div
      class="lista"
      id="listaProductos">

    </div>

  </main>

</section>


<!-- =====================================================
     MODAL PRODUCTO
===================================================== -->

<div
  class="modal"
  id="modalProducto">

  <div class="modal-box">


    <div class="modal-header">

      <h2 id="modalTitulo">
        Nuevo producto
      </h2>

      <button
        class="cerrar"
        onclick="cerrarModal()">

        &times;

      </button>

    </div>


    <form
      onsubmit="guardarProducto(event)"
      id="formProducto">


      <div class="form-grid">


        <!-- NOMBRE -->

        <div class="campo">

          <label>
            Nombre del producto
          </label>

          <input
            type="text"
            id="nombre"
            required
            placeholder="Ej. Air Street">

        </div>


        <!-- MARCA -->

        <div class="campo">

          <label>
            Marca
          </label>

          <input
            type="text"
            id="marca"
            placeholder="Nike, Adidas, Reebok...">

        </div>


        <!-- CATEGORIA -->

        <div class="campo">

          <label>
            Categoría
          </label>

          <select
            id="categoria"
            onchange="cambiarCategoria()"
            required>

            <option value="">
              Seleccionar categoría
            </option>

            <option value="Tenis para dama">Tenis para dama</option>
            <option value="Tenis para hombre">Tenis para hombre</option>
            <option value="Tenis para niños">Tenis para niños</option>
            <option value="Playeras">Playeras</option>
            <option value="Gorras">Gorras</option>
            <option value="Accesorios">Accesorios</option>

          </select>

        </div>


        <!-- PRECIO -->

        <div class="campo">

          <label>
            Precio
          </label>

          <input
            type="number"
            id="precio"
            min="0"
            step="1"
            required
            placeholder="$">

        </div>


        <!-- DESCRIPCION -->

        <div class="campo full">

          <label>
            Descripción
          </label>

          <textarea
            id="descripcion"
            placeholder="Descripción del producto...">
          </textarea>

        </div>


      </div>


      <!-- ACCESORIOS -->

      <div
        class="accesorios-extra"
        id="accesoriosExtra">

        <h3>
          DETALLES DE ACCESORIOS
        </h3>


        <div class="form-grid">


          <div class="campo">

            <label>
              Tipo
            </label>

            <select
              id="tipo">

              <option value="">
                Seleccionar
              </option>

              <option>
                Aretes
              </option>

              <option>
                Dije
              </option>

              <option>
                Pin
              </option>

              <option>
                Pulsera
              </option>

              <option>
                Collar
              </option>

              <option>
                Anillo
              </option>

              <option>
                Charm
              </option>

              <option>
                Otro
              </option>

            </select>

          </div>


          <div class="campo">

            <label>
              Material
            </label>

            <input
              type="text"
              id="material"
              placeholder="Acero inoxidable, metal...">

          </div>


        </div>

      </div>


      <!-- FOTO -->

      <div class="foto-area">

        <img
          id="fotoPreview"
          class="foto-preview"
          alt="Vista previa">


        <label>

          <strong>
            FOTO DEL PRODUCTO
          </strong>

          <br><br>

          Selecciona una foto desde
          tu celular o computadora.

        </label>


        <br><br>


        <input
          class="input-foto"
          type="file"
          id="foto"
          accept="image/*"
          onchange="previsualizarFoto()">

      </div>


      <!-- GUARDAR -->

      <button
        class="btn-guardar"
        type="submit">

        GUARDAR PRODUCTO

      </button>


    </form>

  </div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
  class="toast"
  id="toast">

</div>


<script>
/* =========================================================
   TROPIC DISTRICT · ADMINISTRADOR CON SUPABASE
========================================================= */
const SUPABASE_URL = "https://kieedhsfjlaseyfhckdd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Cssg1pWMHqDVUhZdczsA9g_bbs8nbUK";
const ADMIN_UID = "bd555dc4-ba93-4180-8b41-55c2e6a1d84f";
const TABLA = "tropic_products";
const BUCKET = "tropic-products";
const CATEGORIAS = ["Tenis para dama", "Tenis para hombre", "Tenis para niños", "Playeras", "Gorras", "Accesorios"];
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let productos = [];
let productoEditando = null;
let guardando = false;

const $ = id => document.getElementById(id);
const escapar = valor => String(valor ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]));
const dinero = valor => Number(valor || 0).toLocaleString("es-MX", {style:"currency", currency:"MXN", maximumFractionDigits:2});

async function iniciarSesion(e) {
  e.preventDefault();
  ocultarErrorLogin();
  const email = $("email").value.trim();
  const password = $("password").value;
  const boton = document.querySelector(".btn-login");
  boton.disabled = true;
  boton.textContent = "VERIFICANDO...";
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    if (data.user?.id !== ADMIN_UID) {
      await supabaseClient.auth.signOut();
      throw new Error("Esta cuenta no tiene autorización para administrar Tropic District.");
    }
    await mostrarAdmin();
  } catch (error) {
    mostrarErrorLogin(error.message || "No se pudo iniciar sesión.");
  } finally {
    boton.disabled = false;
    boton.textContent = "ENTRAR AL ADMINISTRADOR";
  }
}

function mostrarErrorLogin(mensaje) {
  $("loginError").textContent = mensaje;
  $("loginError").style.display = "block";
}
function ocultarErrorLogin() { $("loginError").style.display = "none"; }

async function mostrarAdmin() {
  const { data: { user }, error } = await supabaseClient.auth.getUser();
  if (error || !user || user.id !== ADMIN_UID) {
    await supabaseClient.auth.signOut();
    $("admin").style.display = "none";
    $("login").style.display = "flex";
    if (user) mostrarErrorLogin("Esta cuenta no tiene permisos de administrador.");
    return;
  }
  $("login").style.display = "none";
  $("admin").style.display = "block";
  await cargarProductos();
}

async function cerrarSesion() {
  await supabaseClient.auth.signOut();
  location.reload();
}

async function comprobarSesion() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) await mostrarAdmin();
  } catch (error) {
    console.error("Error comprobando sesión:", error);
  }
}

async function cargarProductos() {
  $("listaProductos").innerHTML = '<div class="item"><div class="item-info"><h3>Cargando productos...</h3></div></div>';
  const { data, error } = await supabaseClient.from(TABLA).select("*").order("created_at", { ascending: false });
  if (error) {
    console.error(error);
    $("listaProductos").innerHTML = '<div class="item"><div class="item-info"><h3>No se pudieron cargar los productos</h3><p>Revisa la conexión, la tabla y los permisos de Supabase.</p></div></div>';
    mostrarToast("Error cargando productos: " + error.message);
    return;
  }
  productos = data || [];
  mostrarLista();
  actualizarEstadisticas();
}

function mostrarLista(lista = productos) {
  const contenedor = $("listaProductos");
  contenedor.innerHTML = "";
  if (!lista.length) {
    contenedor.innerHTML = '<div class="item"><div class="item-info"><h3>No hay productos todavía</h3><p>Agrega tu primer producto.</p></div></div>';
    return;
  }
  lista.forEach(p => {
    const div = document.createElement("div");
    div.className = "item";
    const img = p.image_url ? `<img class="item-imagen" src="${escapar(p.image_url)}" alt="${escapar(p.name)}">` : '<div class="item-imagen"></div>';
    div.innerHTML = `${img}
      <div class="item-info">
        <span class="item-categoria">${escapar(p.category || "Sin categoría")}</span>
        <h3>${escapar(p.name)}</h3>
        <p>${escapar(p.brand || "")}${p.active ? "" : " · INACTIVO"}</p>
        <div class="item-precio">${dinero(p.price)} MXN</div>
      </div>
      <div class="item-acciones">
        <button class="btn-editar" data-action="editar" data-id="${escapar(p.id)}">EDITAR</button>
        <button class="btn-estado ${p.active ? "" : "inactivo"}" data-action="estado" data-id="${escapar(p.id)}">${p.active ? "DESACTIVAR" : "ACTIVAR"}</button>
        <button class="btn-eliminar" data-action="eliminar" data-id="${escapar(p.id)}">ELIMINAR</button>
      </div>`;
    contenedor.appendChild(div);
  });
}

$("listaProductos").addEventListener("click", e => {
  const boton = e.target.closest("button[data-action]");
  if (!boton) return;
  const p = productos.find(item => String(item.id) === String(boton.dataset.id));
  if (!p) return;
  if (boton.dataset.action === "editar") editarProducto(p.id);
  if (boton.dataset.action === "estado") cambiarEstado(p.id, p.active);
  if (boton.dataset.action === "eliminar") eliminarProducto(p.id);
});

function actualizarEstadisticas() {
  $("totalProductos").textContent = productos.length;
  $("productosActivos").textContent = productos.filter(p => p.active).length;
  $("totalCategorias").textContent = new Set(productos.map(p => p.category).filter(Boolean)).size;
}

function filtrarProductos() {
  const texto = $("busqueda").value.toLowerCase().trim();
  if (!texto) return mostrarLista();
  mostrarLista(productos.filter(p => [p.name, p.brand, p.category, p.description].some(v => String(v || "").toLowerCase().includes(texto))));
}

function abrirNuevoProducto() {
  productoEditando = null;
  $("modalTitulo").textContent = "Nuevo producto";
  $("formProducto").reset();
  $("fotoPreview").style.display = "none";
  $("fotoPreview").src = "";
  $("foto").value = "";
  cambiarCategoria();
  $("modalProducto").style.display = "block";
}

function editarProducto(id) {
  const p = productos.find(item => String(item.id) === String(id));
  if (!p) return;
  productoEditando = p;
  $("modalTitulo").textContent = "Editar producto";
  $("nombre").value = p.name || "";
  $("marca").value = p.brand || "";
  $("categoria").value = p.category || "";
  $("precio").value = p.price ?? "";
  $("descripcion").value = p.description || "";
  $("tipo").value = p.accessory_type || "";
  $("material").value = p.material || "";
  $("foto").value = "";
  if (p.image_url) {
    $("fotoPreview").src = p.image_url;
    $("fotoPreview").style.display = "block";
  } else {
    $("fotoPreview").src = "";
    $("fotoPreview").style.display = "none";
  }
  cambiarCategoria();
  $("modalProducto").style.display = "block";
}

function cambiarCategoria() {
  $("accesoriosExtra").style.display = $("categoria").value === "Accesorios" ? "block" : "none";
}

function previsualizarFoto() {
  const archivo = $("foto").files[0];
  if (!archivo) return;
  if (!archivo.type.startsWith("image/")) {
    mostrarToast("Selecciona un archivo de imagen válido.");
    $("foto").value = "";
    return;
  }
  const preview = $("fotoPreview");
  if (preview.dataset.objectUrl) URL.revokeObjectURL(preview.dataset.objectUrl);
  const url = URL.createObjectURL(archivo);
  preview.dataset.objectUrl = url;
  preview.src = url;
  preview.style.display = "block";
}

async function subirImagen(archivo) {
  if (!archivo) return null;
  if (!archivo.type.startsWith("image/")) throw new Error("El archivo seleccionado no es una imagen.");
  const extension = (archivo.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
  const ruta = `productos/${Date.now()}-${crypto.randomUUID()}.${extension}`;
  const { error } = await supabaseClient.storage.from(BUCKET).upload(ruta, archivo, { cacheControl: "3600", upsert: false, contentType: archivo.type });
  if (error) throw error;
  const { data } = supabaseClient.storage.from(BUCKET).getPublicUrl(ruta);
  return { url: data.publicUrl, path: ruta };
}

async function guardarProducto(e) {
  e.preventDefault();
  if (guardando) return;
  guardando = true;
  const boton = document.querySelector(".btn-guardar");
  const textoOriginal = boton.textContent;
  boton.disabled = true;
  boton.textContent = "GUARDANDO...";
  try {
    const nombre = $("nombre").value.trim();
    const marca = $("marca").value.trim();
    const categoria = $("categoria").value;
    const precio = Number($("precio").value);
    const descripcion = $("descripcion").value.trim();
    const tipo = $("tipo").value;
    const material = $("material").value.trim();
    const archivo = $("foto").files[0];
    if (!nombre || !categoria || !Number.isFinite(precio) || precio < 0) throw new Error("Revisa el nombre, la categoría y el precio.");

    let imageUrl = productoEditando?.image_url || null;
    let imagePath = productoEditando?.image_path || null;
    if (archivo) {
      const imagen = await subirImagen(archivo);
      imageUrl = imagen.url;
      imagePath = imagen.path;
    }

    const datos = {
      name: nombre,
      brand: marca || null,
      category: categoria,
      price: precio,
      description: descripcion || null,
      image_url: imageUrl,
      image_path: imagePath,
      accessory_type: categoria === "Accesorios" ? (tipo || null) : null,
      material: categoria === "Accesorios" ? (material || null) : null,
      active: productoEditando ? productoEditando.active : true,
      updated_at: new Date().toISOString()
    };

    let error;
    if (productoEditando) {
      ({ error } = await supabaseClient.from(TABLA).update(datos).eq("id", productoEditando.id));
    } else {
      ({ error } = await supabaseClient.from(TABLA).insert(datos));
    }
    if (error) throw error;
    cerrarModal();
    mostrarToast(productoEditando ? "Producto actualizado ✓" : "Producto agregado ✓");
    await cargarProductos();
  } catch (error) {
    console.error(error);
    mostrarToast("No se pudo guardar: " + (error.message || "Error desconocido"));
  } finally {
    guardando = false;
    boton.disabled = false;
    boton.textContent = textoOriginal;
  }
}

async function cambiarEstado(id, estadoActual) {
  const { error } = await supabaseClient.from(TABLA).update({ active: !estadoActual, updated_at: new Date().toISOString() }).eq("id", id);
  if (error) { console.error(error); mostrarToast("No se pudo cambiar el estado: " + error.message); return; }
  mostrarToast(estadoActual ? "Producto desactivado" : "Producto activado");
  await cargarProductos();
}

async function eliminarProducto(id) {
  const p = productos.find(item => String(item.id) === String(id));
  if (!p || !confirm(`¿Seguro que deseas eliminar “${p.name}”? Esta acción no se puede deshacer.`)) return;
  const { error } = await supabaseClient.from(TABLA).delete().eq("id", id);
  if (error) { console.error(error); mostrarToast("No se pudo eliminar: " + error.message); return; }
  // Se elimina el registro; la imagen en Storage se conserva por seguridad.
  mostrarToast("Producto eliminado");
  await cargarProductos();
}

function cerrarModal() {
  $("modalProducto").style.display = "none";
  productoEditando = null;
}

function mostrarToast(mensaje) {
  const toast = $("toast");
  toast.textContent = mensaje;
  toast.style.display = "block";
  clearTimeout(mostrarToast.timer);
  mostrarToast.timer = setTimeout(() => { toast.style.display = "none"; }, 3500);
}

// Cerrar modal si se hace clic en el fondo oscuro.
$("modalProducto").addEventListener("click", e => { if (e.target === $("modalProducto")) cerrarModal(); });
comprobarSesion();
</script>
